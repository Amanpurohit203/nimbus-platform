apiVersion: v1
kind: Service

metadata:
  name: {{ include "nimbus-document-service.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nimbus-document-service.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app: {{ include "nimbus-document-service.name" . }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP