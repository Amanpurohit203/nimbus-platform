version: "3.9"

services:

  postgres:
    image: postgres:16

    container_name: nimbus-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: nimbus
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: